[project]
name = "novacore"
version = "0.1.0"
description = "Terminal AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.1",
    "openai==2.46.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "textual==8.2.8",
]

[project.scripts]
novacore = "novacore.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-tmp"
