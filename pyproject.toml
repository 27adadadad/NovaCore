[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "novacore"
version = "0.1.0"
description = "Terminal AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.1",
    "openai==2.46.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "textual==8.2.8",
]

[project.scripts]
novacore = "novacore.__main__:cli"

[tool.setuptools.packages.find]
include = ["novacore*"]
namespaces = false

[tool.setuptools.package-data]
"novacore.agents.builtins" = ["*.md"]
"novacore.examples" = ["*.json", "agents/*.md", "skills/*/SKILL.md"]
