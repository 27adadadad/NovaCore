name: Offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    defaults:
      run:
        shell: bash
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONUTF8: '1'
      DASHSCOPE_API_KEY: ''
      AUTO_MEMORY_ENABLED: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip check
      - name: Run public offline regressions
        run: python -m pytest tests -v -p no:cacheprovider --basetemp "${{ runner.temp }}/novacore-pytest" --junitxml=reports/junit.xml
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --no-index . --wheel-dir dist
      - name: Verify installed wheel outside checkout
        run: python scripts/check_wheel.py dist
      - name: Upload reports and wheel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            reports/junit.xml
            dist/*.whl
          if-no-files-found: warn
          retention-days: 7
